name: PR Validation

# Pre-merge validation for pull requests targeting main.
# Mirrors the deploy workflow's integrity gates, plus an explicit
# TypeScript check against the documented known-issue baseline
# (tests/typescript-baseline.txt).
#
# Safety properties (by design):
#   - This workflow NEVER deploys: no pages write, no upload-pages-artifact,
#     no environment reference. Deployment stays exclusively in deploy.yml
#     on pushes to main.
#   - Read-only repository permissions; no secrets are referenced, so
#     pull requests from forks run with an unprivileged token.
#   - Uses `pull_request` (not `pull_request_target`): untrusted PR code
#     runs only in this ephemeral, unprivileged job context.
#   - Actions are official publishers pinned to major versions
#     (actions/*, oven-sh/setup-bun), matching deploy.yml's convention.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Blocking integrity gates — lint, bilingual parity, chart logic,
  #    data validation.
  validate:
    name: Lint, i18n, logic and data gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run validate:i18n
      - run: bun run test:logic
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_data.py

  # 2) Explicit TypeScript check, reported separately and accurately:
  #    the production build does not type-gate (next.config.ts documents
  #    ignoreBuildErrors because of pre-existing baseline diagnostics), so
  #    this job makes the true tsc status visible on every PR.
  #    It fails ONLY on diagnostics that are not in the documented
  #    baseline — i.e. genuine new regressions.
  typescript:
    name: TypeScript vs documented baseline (fails only on new errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run tsc and compare with the documented known-issue baseline
        run: |
          set +e
          bunx tsc --noEmit > tsc-current.txt 2>&1
          tsc_status=$?
          set -e
          echo "tsc exit code: $tsc_status (0 = clean, 2 = diagnostics present)"
          cat tsc-current.txt
          echo "--- baseline comparison ---"
          python3 scripts/check_tsc_baseline.py tsc-current.txt

  # 3) Production build proof — the same static export as deploy.yml,
  #    WITHOUT publishing anything.
  build:
    name: Static export build (no deploy)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compute base path
        id: bp
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static export
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_BASE_PATH: ${{ steps.bp.outputs.path }}
        run: bun run build:export
      - name: Sanity-check the exported site
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          echo "Export verified: out/index.html and out/sitemap.xml present."
